; LoRa modem firmware.
;
; The board environment is the only project-specific thing in this file. Every
; radio and link setting is a build flag with a default in src/config.h, so a
; different fleet, band or channel is a flag change and not a code change.

[env]
framework = arduino
lib_deps =
    SPI
    sandeepmistry/LoRa@^0.8.0
build_flags =
    -Wall
    -Wextra

; MKR WAN 1310. The SX1276 sits inside the Murata module behind its own STM32,
; so the radio is on SPI1 and the STM32 has to be parked before it answers;
; src/radio.cpp does that from the variant's own LORA_BOOT0 / LORA_RESET pins.
;
; Two ports, and the contract wants frames alone on one of them (R6):
;   Serial  (USB CDC, /dev/ttyACM*) -- the framed host link
;   Serial1 (pins 13/14)            -- debug text, needs a USB-TTL adapter
; Swap them with -D LORA_HOST_PORT / -D LORA_DEBUG_PORT.
[env:mkrwan1310]
platform = atmelsam
board = mkrwan1310

; Diagnostic build. Same firmware, ports swapped: the debug text comes out on
; USB where it can be read without a USB-TTL adapter, and the framed host link
; moves to pins 13/14 where nothing is attached. The counter line drops to 3 s.
;
; Use it to watch a board that is not receiving. Note that the host port's RX
; pin is left floating, so `resync` will climb -- that is the unconnected UART,
; not the link.
[env:mkrwan1310_diag]
platform = atmelsam
board = mkrwan1310
build_flags =
    ${env.build_flags}
    -D LORA_HOST_PORT=Serial1
    -D LORA_DEBUG_PORT=Serial
    -D LORA_STATS_PERIOD_MS=3000UL

; The diagnostic build plus a synthetic frame pushed onto the transmit queue
; every 3 s, so a board can exercise its transmit path and report its counters
; at the same time -- the host port is on pins 13/14 in this build and cannot
; do both.
[env:mkrwan1310_txtest]
platform = atmelsam
board = mkrwan1310
build_flags =
    ${env:mkrwan1310_diag.build_flags}
    -D LORA_SELFTEST_MS=3000UL

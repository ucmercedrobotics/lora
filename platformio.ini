; LoRa modem firmware.
;
; The board environment is the only project-specific thing in this file. Every
; radio and link setting is a build flag with a default in src/config.h, so a
; different fleet, band or channel is a flag change and not a code change.

[env]
framework = arduino
lib_deps =
    SPI
    sandeepmistry/LoRa@^0.8.0
build_flags =
    -Wall
    -Wextra

; MKR WAN 1310. The SX1276 sits inside the Murata module behind its own STM32,
; so the radio is on SPI1 and the STM32 has to be parked before it answers;
; src/radio.cpp does that from the variant's own LORA_BOOT0 / LORA_RESET pins.
;
; Two ports, and the contract wants frames alone on one of them (R6):
;   Serial  (USB CDC, /dev/ttyACM*) -- the framed host link
;   Serial1 (pins 13/14)            -- debug text, needs a USB-TTL adapter
; Swap them with -D LORA_HOST_PORT / -D LORA_DEBUG_PORT.
[env:mkrwan1310]
platform = atmelsam
board = mkrwan1310

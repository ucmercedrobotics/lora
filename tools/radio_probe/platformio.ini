; Drives the modem's real src/radio.cpp -- symlinked into src/, so it cannot
; drift -- and reports on USB serial instead of the debug UART.
;
; tools/rf_probe proved the radios, the antennas, the range and the on-air
; settings. This isolates the one layer that test bypassed.
[env:mkrwan1310]
platform = atmelsam
board = mkrwan1310
framework = arduino
lib_deps =
    SPI
    sandeepmistry/LoRa@^0.8.0
build_flags =
    -Wall
    -Wextra
